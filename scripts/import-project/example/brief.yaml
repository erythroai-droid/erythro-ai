# Copy to content/imports/<slug>/brief.yaml
# Scheme: pro-interior / ORA 60A — six body sections as rich Lexical
# (overview → challenges → engineering → features → metrics → results).
# Do not invent metrics. Optional: body.ts for hand-authored rich body.
# Then: pnpm import:project -- content/imports/<slug> --dry-run

slug: example-import
category: websites # portfolio-categories.value (must already exist)
date: 2024 — 2025
client: Demo
link: https://example.com
stack:
  - Figma
  - React
  - Spring Boot
tags:
  - website
  - react

# Optional — otherwise the script picks card.*, hero.*, hero-mobile.* in this folder
# media:
#   card: card.jpg
#   hero: hero.jpg
#   heroMobile: hero-mobile.jpg

# Optional body screenshots (paths relative to this folder).
# Prefer body/overview, body/engineering, body/metrics (legacy body/frontend still maps to engineering).
# bodyImages:
#   engineering:
#     - shots/catalog.png
#   metrics:
#     - shots/lighthouse.png

# Optional highlights table under the project title (CMS Highlights field).
highlights:
  - label:
      en: Tech stack
      ru: Стек технологий
      he: סטאק טכנולוגי
    detail:
      en: Figma · React · Spring Boot
      ru: Figma · React · Spring Boot
      he: Figma · React · Spring Boot
  - label:
      en: Performance
      ru: Производительность
      he: ביצועים
    detail:
      en: Same-origin static client · fewer network hops
      ru: Клиент с того же origin · меньше hops
      he: לקוח מאותו origin · פחות hops
    # metrics:
    #   - value: "96"
    #     label: { en: Lighthouse mobile, ru: Lighthouse, мобильный, he: Lighthouse מובייל }
    # metricsNote:
    #   en: Lighthouse 12, example.com, November 2026

# Optional feature bullets (otherwise facts.KEY_FEATURES, one item per line).
features:
  en:
    - "**Catalog:** Filters and product cards on a modular grid"
    - "**Checkout:** Cart → order email in one flow"
  ru:
    - "**Каталог:** Фильтры и карточки товаров в модульной сетке"
    - "**Checkout:** Корзина → письмо заказа в одном потоке"
  he:
    - "**קטלוג:** סינון וכרטיסי מוצר על גריד מודולרי"
    - "**Checkout:** עגלה → מייל הזמנה בזרימה אחת"

# Optional metrics block (table + notes). Skip if you have no lab numbers.
# metrics:
#   intro:
#     en: Lighthouse 12 on the live site, November 2026.
#     ru: Lighthouse 12 на живом сайте, ноябрь 2026.
#     he: Lighthouse 12 על האתר החי, נובמבר 2026.
#   table:
#     en:
#       - [Metric, Mobile, Desktop, Google target]
#       - [Performance, 96, 89, 90+]
#     ru:
#       - [Метрика, Мобильный, Десктоп, Норматив Google]
#       - [Performance, 96, 89, 90+]
#     he:
#       - [מדד, מובייל, דסקטופ, יעד Google]
#       - [Performance, 96, 89, 90+]
#   notes:
#     en:
#       - "**Zero CLS:** Fixed hero proportions before first paint"
#     ru:
#       - "**CLS = 0:** Фиксированные пропорции hero до первой отрисовки"

facts:
