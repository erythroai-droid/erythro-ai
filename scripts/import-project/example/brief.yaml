    CICD_DETAILS: Standard review pipeline
    AI_SECURITY_DETAILS: Spring Security with PKCE; no hotlinked email images
    SPEED_METRIC_RESULT: Same-origin static client, fewer network hops
    RELIABILITY_RESULT: Second-level cache reduces repeated catalog reads
    CONVERSION_RESULT: End-to-end checkout plus HTML order emails
    SEO_RESULT: Server-injected meta/OG for catalog pages
