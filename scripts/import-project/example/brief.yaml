# Copy this file to content/imports/<slug>/brief.yaml
# Fill facts from docs/cases/case-study-template.md. Do not invent metrics.
# Create the project in Payload admin first and set the same Slug.
# Then: pnpm import:project -- content/imports/<slug> --dry-run

slug: example-import
category: websites # portfolio-categories.value (must already exist)
date: 2024 — 2025
client: Demo
link: https://example.com
stack:
  - Figma
  - React
  - Spring Boot
tags:
  - website
  - react

# Optional — otherwise the script picks card.*, hero.*, hero-mobile.* in this folder
# media:
#   card: card.jpg
#   hero: hero.jpg
#   heroMobile: hero-mobile.jpg

# Optional body screenshots (paths relative to this folder)
# bodyImages:
#   frontend:
#     - shots/catalog.png
#   results:
#     - shots/lighthouse.png

facts:
