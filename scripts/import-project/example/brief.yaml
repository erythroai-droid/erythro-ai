    CLIENT_NAME: Demo
    TECH_STACK_LIST: Figma, React, Spring Boot
    DEMO_URL_FULL: https://example.com
    PROJECT_CONTEXT_AND_PAIN_POINTS: |
      What the client needed and why the previous setup failed. No invented numbers.
    ARCHITECTURE_GOAL: Fast, cacheable storefront with a single origin
    DESIGN_GOAL: Clear catalog → product → checkout path
    BUSINESS_GOAL: Fewer drop-offs between cart and order email
    AUTOMATION_GOAL: Secure social login and transactional mail
    FRONTEND_STACK: Figma → React SPA
