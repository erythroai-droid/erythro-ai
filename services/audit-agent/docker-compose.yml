services:
  audit-agent:
    build: .
    container_name: audit_agent_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
      - QA_AUDITOR_DIR=/app/QA_Auditor
    # No host port publish — reach via Caddy on proxy_network
    networks:
      - proxy_network
    deploy:
      resources:
        limits:
          cpus: "1.8"
          memory: 4500M

networks:
  proxy_network:
    external: true
