# Supabase DB Keepalive Workflow
#
# Supabase free-tier projects automatically pause after 7 days of inactivity.
# This workflow runs every 3 days to send a lightweight ping and keep the database active.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   DATABASE_URL — Postgres connection string (direct or session pooler)

name: Supabase DB Keepalive

on:
  schedule:
    # 04:30 UTC every 3 days — keeps Supabase active well within the 7-day inactivity limit
    - cron: '30 4 */3 * *'
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ping Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_REGION: ap-southeast-1
        run: node scripts/ping-db.mjs
