# Runs automated tests on every PR and push to main.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   DATABASE_URL   — Postgres URL (required for API Tests job)
#   PAYLOAD_SECRET — Payload CMS secret (optional for API Tests)
#
# To block Vercel production until checks pass:
# Vercel → Deployment Checks → add "Unit Tests" (and optionally "API Tests") → Required

name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        # Pure suites only — no DB required.
        run: pnpm exec vitest run --config ./vitest.config.mts --exclude tests/int/api.int.spec.ts

  api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare DATABASE_URL
        id: db
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Project region from Supabase (ap-southeast-1). Used only to rewrite
          # IPv6-only direct host → IPv4 session pooler for GitHub Actions.
          SUPABASE_REGION: ap-southeast-1
        run: |
          if [ -z "$RAW_DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret is empty — skipping API tests"
            exit 0
          fi

          url="$RAW_DATABASE_URL"

          # Direct db.*.supabase.co is IPv6-only → ENETUNREACH on GHA runners.
          # Rewrite to Supavisor session pooler (IPv4, port 5432).
          if [[ "$url" =~ ^(postgres(ql)?://)([^:]+):([^@]+)@db\.([a-z0-9]+)\.supabase\.co(:[0-9]+)?/([^?]+) ]]; then
            scheme="${BASH_REMATCH[1]}"
            pass="${BASH_REMATCH[4]}"
            ref="${BASH_REMATCH[5]}"
            dbname="${BASH_REMATCH[7]}"
            url="${scheme}postgres.${ref}:${pass}@aws-0-${SUPABASE_REGION}.pooler.supabase.com:5432/${dbname}"
            echo "Rewrote direct Supabase URL to session pooler (IPv4)"
          fi

          if [[ "$url" != *"sslmode="* ]]; then
            if [[ "$url" == *"?"* ]]; then
              url="${url}&sslmode=no-verify"
            else
              url="${url}?sslmode=no-verify"
            fi
          else
            # require still verifies the chain and fails on Supabase from GHA
            url="${url//sslmode=require/sslmode=no-verify}"
          fi

          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL ready"

      - name: Run API integration test
        if: steps.db.outputs.skip != 'true'
        run: pnpm exec vitest run --config ./vitest.config.mts tests/int/api.int.spec.ts
