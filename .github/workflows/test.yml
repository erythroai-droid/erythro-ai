# Runs automated tests on every PR and push to main.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   DATABASE_URL   — Postgres URL (required for API Tests job)
#   PAYLOAD_SECRET — Payload CMS secret (optional for API Tests)
#
# To block Vercel production until checks pass:
# Vercel → Deployment Checks → add "Unit Tests" (and optionally "API Tests") → Required

name: Tests
# ci smoke: verify Actions + Vercel deployment checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        # Pure suites only — no DB required.
        run: pnpm exec vitest run --config ./vitest.config.mts --exclude tests/int/api.int.spec.ts

  api:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare DATABASE_URL
        id: db
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_REGION: ap-southeast-1
        run: |
          if [ -z "$RAW_DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret is empty — skipping API tests"
            exit 0
          fi

          export DATABASE_URL="$RAW_DATABASE_URL"
          resolved="$(node scripts/ci-resolve-supabase-url.mjs)"
          echo "DATABASE_URL=$resolved" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL ready"

      - name: Run API integration test
        if: steps.db.outputs.skip != 'true'
        env:
          DATABASE_SSL_INSECURE: '1'
          # Keep Payload off the production migrate/push paths during CI init.
          NODE_ENV: test
        run: pnpm exec vitest run --config ./vitest.config.mts tests/int/api.int.spec.ts
